{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <link rel="icon" type="image/png" href="{% static 'favicon.png' %}">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Administración | Volantines Strong</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">

  <style>
    :root {
      --admin-bg: #080808;
      --admin-panel: #111;
      --admin-cream: #f6efe6;
      --admin-line: rgba(255,255,255,.13);
      --admin-red: #e72d26;
      --admin-red-hover: #ff483d;
    }

    * {
      box-sizing: border-box;
    }

    body.admin-page {
      min-height: 100vh;
      margin: 0;
      background: var(--admin-bg);
      color: white;
      font-family: Inter, sans-serif;
    }

    .admin-page a {
      color: inherit;
      text-decoration: none;
    }

    .admin-shell {
      width: min(1380px, calc(100% - 42px));
      margin: 0 auto;
    }

    .admin-eyebrow {
      color: #999;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .admin-red {
      color: var(--admin-red);
    }

    /* ==========================================
       LOGIN
       ========================================== */

    #login-view.hidden,
    #dashboard-view.hidden {
      display: none !important;
    }

    #login-view {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 18px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(
          ellipse at 18% 20%,
          rgba(231,45,38,.14),
          transparent 38%
        ),
        radial-gradient(
          ellipse at 85% 85%,
          rgba(231,45,38,.09),
          transparent 34%
        ),
        #080808;
    }

    #login-view::before {
      content: "STRONG";
      position: absolute;
      left: -35px;
      bottom: -62px;
      color: rgba(255,255,255,.025);
      font-size: clamp(130px, 24vw, 330px);
      font-weight: 900;
      font-style: italic;
      letter-spacing: -.09em;
      pointer-events: none;
    }

    .login-card {
      width: min(100%, 440px);
      position: relative;
      z-index: 1;
      padding: 42px;
      border: 1px solid var(--admin-line);
      border-radius: 26px;
      background: rgba(17,17,17,.92);
      box-shadow: 0 28px 90px rgba(0,0,0,.42);
    }

    /* ==========================================
       LOGO DEL ADMINISTRADOR
       ========================================== */

    .admin-brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .admin-logo {
      width: 52px;
      height: 52px;
      min-width: 52px;
      min-height: 52px;
      flex: 0 0 52px;
      aspect-ratio: 1 / 1;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border: 2px solid var(--admin-red);
      border-radius: 50%;
      background: #050505;

      overflow: hidden;
    }

    .admin-logo .LogoVolantineStrong {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;

      object-fit: contain;
      object-position: center;

      display: block;
      transform: none;
    }

    .admin-brand-name {
      font-size: 14px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -.04em;
    }

    .admin-brand-name small {
      display: block;
      margin-top: 3px;
      color: #888;
      font-size: 8px;
      font-style: normal;
      letter-spacing: .16em;
    }

    .login-title {
      margin: 38px 0 8px;
      font-size: clamp(32px, 6vw, 43px);
      line-height: .95;
      font-weight: 900;
      letter-spacing: -.065em;
      text-transform: uppercase;
    }

    .login-subtitle {
      margin: 0 0 28px;
      color: #999;
      font-size: 13px;
      line-height: 1.6;
    }

    /* ==========================================
       FORMULARIOS
       ========================================== */

    .admin-form-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 19px 16px;
    }

    .admin-field {
      min-width: 0;
    }

    .admin-field label {
      display: block;
      margin-bottom: 8px;
      color: #c9c9c9;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .admin-input,
    .admin-select {
      width: 100%;
      min-height: 45px;
      padding: 11px 13px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 10px;
      outline: none;
      background: #090909;
      color: var(--admin-cream);
      font-size: 13px;
      transition: .2s;
    }

    .admin-input::placeholder {
      color: #666;
    }

    .admin-input:focus,
    .admin-select:focus {
      border-color: var(--admin-red);
      box-shadow: 0 0 0 3px rgba(231,45,38,.12);
    }

    .admin-input[type="file"] {
      padding: 8px;
      color: #999;
      font-size: 11px;
    }

    .admin-input[type="file"]::file-selector-button {
      margin-right: 10px;
      padding: 7px 10px;
      border: 0;
      border-radius: 7px;
      background: rgba(231,45,38,.15);
      color: #ff7169;
      font-weight: 800;
      cursor: pointer;
    }

    /* ==========================================
       BOTONES
       ========================================== */

    .admin-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 11px 18px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: var(--admin-red);
      color: white;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: .2s;
    }

    .admin-btn:hover {
      transform: translateY(-2px);
      background: var(--admin-red-hover);
    }

    .admin-btn:disabled {
      opacity: .55;
      cursor: wait;
    }

    .admin-btn.secondary {
      border-color: var(--admin-line);
      background: transparent;
      color: #ddd;
    }

    .admin-btn.secondary:hover {
      border-color: white;
      background: rgba(255,255,255,.06);
    }

    .login-submit {
      width: 100%;
      margin-top: 8px;
      min-height: 48px;
    }

    /* ==========================================
       ENCABEZADO DEL DASHBOARD
       ========================================== */

    #dashboard-view {
      min-height: 100vh;
      background: var(--admin-bg);
    }

    .admin-header {
      position: sticky;
      top: 0;
      z-index: 30;
      border-bottom: 1px solid var(--admin-line);
      background: rgba(8,8,8,.84);
      backdrop-filter: blur(18px);
    }

    .admin-header-inner {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .admin-header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .admin-header-brand .admin-logo {
      width: 46px;
      height: 46px;
      min-width: 46px;
      min-height: 46px;
      flex-basis: 46px;
    }

    .admin-header-title {
      font-size: 14px;
      font-weight: 900;
      font-style: italic;
    }

    .admin-header-title span {
      color: var(--admin-red);
      font-style: normal;
      font-size: 10px;
      letter-spacing: .16em;
    }

    .admin-header-actions {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .logout-btn {
      min-height: 36px;
      padding: 9px 14px;
      border: 1px solid rgba(231,45,38,.45);
      border-radius: 999px;
      background: rgba(231,45,38,.12);
      color: #ff7169;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .logout-btn:hover {
      background: var(--admin-red);
      color: white;
    }

    /* ==========================================
       CONTENIDO DEL ADMINISTRADOR
       ========================================== */

    .admin-main {
      padding-top: 48px;
      padding-bottom: 70px;
    }

    .admin-welcome {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 25px;
      margin-bottom: 34px;
    }

    .admin-welcome h1 {
      margin: 9px 0 0;
      font-size: clamp(38px, 6vw, 66px);
      line-height: .88;
      font-weight: 900;
      letter-spacing: -.07em;
      text-transform: uppercase;
    }

    .admin-welcome h1 span {
      color: var(--admin-red);
    }

    .admin-welcome p {
      max-width: 390px;
      margin: 0;
      color: #929292;
      font-size: 12px;
      line-height: 1.65;
    }

    .admin-section {
      margin-top: 20px;
      padding: 25px;
      border: 1px solid var(--admin-line);
      border-radius: 20px;
      background: linear-gradient(
        145deg,
        rgba(255,255,255,.035),
        rgba(255,255,255,.012)
      );
    }

    .admin-section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 23px;
    }

    .admin-section-head h2 {
      margin: 0;
      color: var(--admin-cream);
      font-size: 19px;
      font-weight: 900;
      letter-spacing: -.04em;
      text-transform: uppercase;
    }

    .admin-section-head p {
      margin: 6px 0 0;
      color: #777;
      font-size: 10px;
    }

    .section-index {
      color: var(--admin-red);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .16em;
    }

    .form-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      grid-column: 1 / -1;
      padding-top: 3px;
    }

    /* ==========================================
       TABLAS DE INVENTARIO Y PEDIDOS
       ========================================== */

    .admin-table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 13px;
    }

    .admin-table {
      width: 100%;
      min-width: 720px;
      border-collapse: collapse;
      text-align: left;
      font-size: 12px;
    }

    .admin-table thead {
      background: #1a1a1a;
    }

    .admin-table th {
      padding: 15px 14px;
      color: #999;
      border-bottom: 1px solid var(--admin-line);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .13em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .admin-table td {
      padding: 13px 14px;
      border-bottom: 1px solid rgba(255,255,255,.07);
      color: #ddd;
      vertical-align: middle;
    }

    .admin-table tbody tr:last-child td {
      border-bottom: 0;
    }

    .admin-table tbody tr:hover {
      background: rgba(255,255,255,.025);
    }

    .admin-table tbody td:first-child {
      color: white;
    }

    .admin-table select {
      max-width: 190px;
      border: 1px solid rgba(255,255,255,.16) !important;
      border-radius: 8px !important;
      background: #090909 !important;
      color: #eee !important;
      padding: 8px 10px !important;
    }

    .admin-table button {
      font-weight: 800;
    }

    .admin-table img {
      border: 1px solid var(--admin-line);
    }

    .admin-hint {
      margin: 16px 0 0;
      color: #777;
      font-size: 10px;
      line-height: 1.6;
    }

    /* ==========================================
       FOOTER
       ========================================== */

    .admin-footer {
      padding: 22px 0 30px;
      border-top: 1px solid var(--admin-line);
      color: #666;
      font-size: 9px;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .admin-footer-inner {
      display: flex;
      justify-content: space-between;
      gap: 15px;
    }

    /* ==========================================
       RESPONSIVE
       ========================================== */

    @media (max-width: 850px) {
      .admin-form-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .admin-welcome {
        display: block;
      }

      .admin-welcome p {
        margin-top: 17px;
      }
    }

    @media (max-width: 600px) {
      .admin-shell {
        width: min(100% - 24px, 1380px);
      }

      .login-card {
        padding: 29px 23px;
      }

      .admin-header-inner {
        min-height: 68px;
      }

      .admin-header-actions {
        gap: 10px;
      }

      .logout-btn {
        padding: 8px 10px;
        font-size: 8px;
      }

      .admin-header-title {
        font-size: 11px;
      }

      .admin-header-brand .admin-logo {
        width: 40px;
        height: 40px;
        min-width: 40px;
        min-height: 40px;
        flex-basis: 40px;
      }

      .admin-main {
        padding-top: 34px;
      }

      .admin-section {
        padding: 18px 14px;
        border-radius: 16px;
      }

      .admin-section-head {
        align-items: flex-start;
      }

      .admin-section-head h2 {
        font-size: 16px;
      }

      .admin-form-grid {
        grid-template-columns: 1fr;
        gap: 15px;
      }

      .form-actions {
        flex-wrap: wrap;
      }

      .admin-footer-inner {
        flex-direction: column;
      }
    }


/* ==========================================
   TABLA DE PEDIDOS - DISEÑO RESPONSIVO
   ========================================== */

.admin-orders-table-wrap {
    width: 100%;
    max-width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
}

.admin-orders-table {
    width: 100%;
    min-width: 1120px;
    border-collapse: collapse;
}

/* Columnas */
.admin-orders-table th,
.admin-orders-table td {
    padding: 15px 12px;
    vertical-align: middle;
}

.admin-orders-table th:nth-child(2),
.admin-orders-table td:nth-child(2) {
    min-width: 230px;
}

.admin-orders-table th:nth-child(3),
.admin-orders-table td:nth-child(3) {
    min-width: 225px;
}

.admin-orders-table th:nth-child(5),
.admin-orders-table td:nth-child(5) {
    min-width: 160px;
}

.admin-orders-table th:nth-child(6),
.admin-orders-table td:nth-child(6) {
    min-width: 235px;
}

/* Botones Notificar y Eliminar */
.admin-orders-table .admin-order-row-actions {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;
    flex-wrap: nowrap;
    gap: 9px;
    width: max-content;
}

.admin-orders-table .notify-order-btn,
.admin-orders-table .delete-order-btn {
    flex-shrink: 0;
    white-space: nowrap;
    min-width: 92px;
    text-align: center;
}

/* Selector de estado */
.admin-orders-table select[data-order-id] {
    width: 145px;
    min-width: 145px;
    max-width: none;
}

  </style>
</head>

<body class="admin-page">
{% if messages %}
<div class="admin-shell" style="padding-top:18px;">
  {% for message in messages %}
  <p class="text-xs font-bold" style="color:{% if message.tags == 'error' %}#f87171{% elif message.tags == 'warning' %}#fbbf24{% else %}#4ade80{% endif %};">
    {{ message }}
  </p>
  {% endfor %}
</div>
{% endif %}
{% block admin_content %}{% endblock %}
  <!-- ==========================================
       SUPABASE Y ADMIN.JS
       ========================================== -->

  <script src="{% static 'js/supabase-client.js' %}"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="{% static 'js/admin.js' %}"></script>

  <script>
    const adminYear = document.getElementById('admin-year');

    if (adminYear) {
      adminYear.textContent = new Date().getFullYear();
    }
  </script>

</body>
</html>
